<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Random Number Generator</title>

  
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a5acd, #00bfff);
      color: white;
      text-align: center;
      padding-top: 60px;
    }


    h1 {
      font-size: 40px;
      margin-bottom: 20px;
      animation: fadeIn 1.2s ease;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      padding: 25px;
      border-radius: 15px;
      width: 350px;
      margin: auto;
      backdrop-filter: blur(10px);
      animation: popIn 0.8s ease;
    }

    input {
      width: 80px;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      text-align: center;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ffdd57;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    button:hover {
      transform: scale(1.1);
      background: #ffe680;
    }

    #dice {
      font-size: 60px;
      margin-top: 20px;
      animation: bounce 1s infinite;
    }

    #result {
      font-size: 32px;
      margin-top: 20px;
      font-weight: bold;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>

<body>

  <h1>🎲 Random Number Generator</h1>

  <div class="container">
    <label>Min:
      <input type="number" id="min" value="1">
    </label>
    <br><br>
    <label>Max:
      <input type="number" id="max" value="100">
    </label>
    <br><br>

    <button onclick="generateRandom()">Roll 🎲</button>

    <div id="dice">🎲</div>
    <div id="result">Your number will appear here</div>
  </div>

  <script>
    function generateRandom() {
      const min = parseInt(document.getElementById("min").value, 10);
      const max = parseInt(document.getElementById("max").value, 10);

      if (isNaN(min) || isNaN(max) || min > max) {
        document.getElementById("result").textContent = "Enter a valid range.";
        return;
      }

      // Dice spin animation
      const dice = document.getElementById("dice");
      dice.style.animation = "none";
      void dice.offsetWidth; 
      dice.style.animation = "bounce 0.4s ease";

      const random = Math.floor(Math.random() * (max - min + 1)) + min;

      document.getElementById("result").textContent = "🎉 " + random + " 🎉";
    }
  </script>

</body>
<!-- FUN FACT + TRAMPOLINE WIDGET -->

    <div id="trampoline" onclick="bounceTrampoline()">🧍‍♂️</div>
    <p id="click-count">Clicks today: 0</p>

</div>

<style>

    margin-top: 40px;
    display: flex;

    gap: 25px;
    align-items: center;

    background: rgba(255,255,255,0.2);
    padding: 20px;
    width: 260px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
    text-align: center;
    animation: fadeIn 1s ease;

  .trampoline-container {
    text-align: center;
  }

  #trampoline {
    font-size: 60px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  #trampoline.bounce {
    transform: translateY(-20px);
  }

  #click-count {
    margin-top: 10px;
    font-size: 18px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

  /* ---------------- TRAMPOLINE ---------------- */
  function loadClickCount() {
    const today = new Date().toDateString();
    const savedDate = localStorage.getItem("trampolineDate");
    let count = 0;

    if (savedDate === today) {
      count = parseInt(localStorage.getItem("trampolineClicks") || "0");
    } else {
      localStorage.setItem("trampolineDate", today);
      localStorage.setItem("trampolineClicks", "0");
    }

    document.getElementById("click-count").textContent = "Clicks today: " + count;
  }

  function bounceTrampoline() {
    const tramp = document.getElementById("trampoline");

    tramp.classList.add("bounce");
    setTimeout(() => tramp.classList.remove("bounce"), 200);

    const today = new Date().toDateString();
    localStorage.setItem("trampolineDate", today);

    let count = parseInt(localStorage.getItem("trampolineClicks") || "0");
    count++;
    localStorage.setItem("trampolineClicks", count);

    document.getElementById("click-count").textContent = "Clicks today: " + count;
  }

  loadClickCount();

<script>
  function toggleMusic() {
    const audio = document.getElementById("my-audio");

    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  }
</script>
